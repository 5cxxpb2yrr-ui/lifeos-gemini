name: Deploy Mission Control Repository Scaffold

on:
  push:
    branches:
      - main
    paths:
      - 'mission-control-gemini.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the ZIP exists
        run: |
          if [ ! -f "mission-control-gemini.zip" ]; then
            echo "Error: mission-control-gemini.zip not found in repo root"
            exit 1
          fi

      - name: Unzip into repo root
        run: |
          mkdir -p temp_unzip
          unzip -o mission-control-gemini.zip -d temp_unzip/
          rsync -av --exclude='.git' temp_unzip/ ./
          rm -rf temp_unzip mission-control-gemini.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(deploy): unpack mission-control-gemini scaffold [skip ci]"
            git push origin main
          fi
